<div class="groups-container container-fluid py-4">
	<!-- Top controls: stats, search, filter -->
	<div class="row mb-4 align-items-center">
		<div class="col-12 col-md-6 col-lg-4 mb-3 mb-lg-0">
			<div class="d-flex gap-3">
				<div class="stat-card p-3">
					<div class="stat-value">{{ employee_group.length || 0 }}</div>
					<div class="stat-label">Total Groups</div>
				</div>
				<div class="stat-card p-3">
					<div class="stat-value">{{ activeCount }}</div>
					<div class="stat-label">Active</div>
				</div>
			</div>
		</div>
		<div class="col-12 col-md-6 col-lg-5 ms-auto mb-3 mb-lg-0">
			<div class="d-flex gap-2">
				<input class="form-control flex-grow-1" placeholder="Search groups..." (input)="searchTerm = $any($event.target).value" />
				<select class="form-select w-auto" [(ngModel)]="filterStatus">
					<option value="all">All</option>
					<option value="active">Active</option>
					<option value="inactive">Inactive</option>
				</select>
			</div>
		</div>
	</div>

	<div class="row g-4">
		<ng-container *ngIf="filteredGroups.length; else empty">
			<div class="col-12 col-sm-6 col-lg-4" *ngFor="let g of filteredGroups">
  <a
    [routerLink]="['/groups', g.id]"
    class="group-card text-decoration-none"
  >
    <div class="group-card-header">
      <img
        [src]="getImageUrl(g.profile_pic)"
        [alt]="g.name"
        class="group-avatar"
      />

      <span
        class="status-badge"
        [ngClass]="g.is_active ? 'active' : 'inactive'"
      >
        {{ g.is_active ? 'Active' : 'Inactive' }}
      </span>
    </div>

    <div class="group-card-body">
      <h5>{{ g.name }}</h5>

      <p class="group-code">
        {{ g.group_code }}
      </p>

      <p class="group-description">
        {{ g.description }}
      </p>
        <p class="card-text text-muted mb-1"><small>Created: {{ formatDate(g.created_at) }}</small></p>
    </div>

    <div class="group-card-footer">
      <span>
        <i class="bi bi-people-fill"></i>
        Team Group
      </span>

      <span class="view-link">
        View Details
        <i class="bi bi-arrow-right"></i>
      </span>
    </div>
  </a>
</div>
		</ng-container>

		<ng-template #empty>
			<div class="col-12">
				<div class="alert alert-info mb-0">You are not a member of any groups yet.</div>
			</div>
		</ng-template>
	</div>
</div>
