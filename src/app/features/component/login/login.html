<div class="login-page">

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-lg-5 col-md-12 col-sm-10">

                <div class="login-card">


                    <div class="text-center mb-4">

                        <div class="logo-icon mx-auto mb-3">

                            <i class="fa-solid fa-layer-group"></i>

                        </div>

                        <h2 class="brand-title">
                            TeamTrack
                        </h2>

                        <p class="brand-subtitle">
                            Enterprise Task Management System
                        </p>

                    </div>


                    <form #loginForm="ngForm" (ngSubmit)="login(loginForm)">


                        <div class="mb-4">

                            <label class="form-label">

                                Email Address

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="fa-solid fa-envelope"></i>

                                </span>

                                <input type="email" class="form-control" placeholder="Enter your email" name="email"
                                    [(ngModel)]="email" #emailField="ngModel" required email>

                            </div>


                            @if(emailField.invalid && emailField.touched){

                            <small class="text-danger">

                                Valid email is required

                            </small>

                            }

                        </div>


                        <div class="mb-4">

                            <label class="form-label">

                                Password

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="fa-solid fa-lock"></i>

                                </span>

                                <input type="password" class="form-control" placeholder="Enter your password"
                                    name="password" [(ngModel)]="password" #passwordField="ngModel" required
                                    minlength="6">

                            </div>


                            @if(passwordField.invalid && passwordField.touched){

                            <small class="text-danger">

                                Password must be at least 6 characters

                            </small>

                            }

                        </div>


                        <div class="d-flex justify-content-between align-items-center mb-4">

                            <div class="form-check">

                                <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe">

                                <label class="form-check-label" for="rememberMe">

                                    Remember me

                                </label>

                            </div>



                        </div>


                        <button type="submit" class="btn login-btn w-100" [disabled]="loginForm.invalid">

                            <i class="fa-solid fa-right-to-bracket me-2"></i>

                            Login

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
